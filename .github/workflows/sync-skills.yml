name: Sync Skills

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - .github/skills-sources.json
      - .github/scripts/sync-skills.mjs
      - .github/workflows/sync-skills.yml
      # Line-ending attributes change what the drift check sees.
      - .gitattributes

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/sync-skills
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync vendored skills
        run: node .github/scripts/sync-skills.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync vendored agent skills from upstream"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "chore: sync vendored agent skills" \
              --body "Automated sync from the upstream repositories listed in \`.github/skills-sources.json\`.

          Review the diff before merging - these skills execute shell commands during agent runs."
          fi

      - name: Fail if manifest edit was not synced
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          echo "::error::.github/cloud-skills/ is out of date with the manifest. Run 'node .github/scripts/sync-skills.mjs' and commit the result."
          exit 1
